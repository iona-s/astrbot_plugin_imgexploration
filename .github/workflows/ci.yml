name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}/..

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "astrbot>=4.25,<5" \
            "pytest>=9,<10" \
            "pytest-cov>=7,<8" \
            "pre-commit>=4,<5" \
            --requirement requirements.txt

      - name: Run tests
        run: >-
          python -m pytest
          --cov=astrbot_plugin_imgexploration
          --cov-branch
          --cov-report=term-missing

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  minimum-astrbot:
    name: Tests (AstrBot 4.25.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}/..

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "astrbot==4.25.0" \
            "pytest>=9,<10" \
            --requirement requirements.txt

      - name: Verify AstrBot version
        run: >-
          python -c "from importlib.metadata import version;
          actual = version('astrbot');
          print(f'AstrBot {actual}');
          assert actual == '4.25.0', actual"

      - name: Run tests
        run: python -m pytest

  release:
    name: Release From Changelog
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - test
      - minimum-astrbot
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-from-changelog.yml
    with:
      automatic: true
      before_sha: ${{ github.event.before }}
      release_ref: ${{ github.ref }}
      target_sha: ${{ github.sha }}
