name: Bug 反馈
description: 报告一个可以稳定复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢花时间反馈问题。请尽量填写完整，方便维护者定位原因。
        提交前请先搜索现有 [Issues](https://github.com/iona-s/astrbot_plugin_imgexploration/issues) 和 [Discussions](https://github.com/iona-s/astrbot_plugin_imgexploration/discussions)。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issues 和 Discussions，确认没有重复反馈
          required: true
        - label: 我使用的插件和 AstrBot 均不是明显过期的版本
          required: true
        - label: 我已完整重启 AstrBot，并确认问题仍然存在
          required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 填写插件版本号；使用开发版本时填写 commit hash
      placeholder: "例如 v1.0.3 或 8c0baa9"
    validations:
      required: true

  - type: input
    id: astrbot-version
    attributes:
      label: AstrBot 版本
      placeholder: "例如 v4.26.7"
    validations:
      required: true

  - type: input
    id: adapter
    attributes:
      label: 消息平台与适配器
      placeholder: "例如 QQ 群聊 / aiocqhttp / NapCat"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 填写操作系统、Python 版本和部署方式
      placeholder: "例如 Windows 11 / Python 3.12 / 本机部署"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明发生了什么
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 提供能够稳定复现问题的完整操作步骤
      placeholder: |
        1. 启动 AstrBot
        2. 在群聊中发送……
        3. 执行……
        4. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        请提供从触发问题到异常出现期间的完整相关日志。
        提交前请移除 API 密钥、账号凭据、完整签名图片 URL、base64 图片数据及其他隐私信息。
      placeholder: 在此粘贴日志，或拖入日志文件
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可提供脱敏后的配置、截图以及相关 Issue 或 PR 链接
